model_list:
  - model_name: gpt-5.4-mini
    litellm_params:
      model: openai/gpt-5.4-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-5-nano
    litellm_params:
      model: openai/gpt-5-nano
      api_key: os.environ/OPENAI_API_KEY

litellm_settings:
  # Budget limits to prevent runaway swarm costs
  max_budget: 20  # USD per day cap
  drop_params: true  # Silently drop unsupported params (e.g. temperature for gpt-5 models)

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

# Usage: litellm --config litellm-config.yaml --port 4000
# Then set in MiroFish .env:
#   LLM_BASE_URL=http://localhost:4000
#   LLM_API_KEY=<LITELLM_MASTER_KEY>
#   LLM_MODEL_NAME=qwen-plus
